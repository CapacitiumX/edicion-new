<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CapacitiumX Studio V47 - Master Definitiva</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #3b82f6; --bg: #050507; --panel: #121216; --track-bg: #1f1f23; --golden: #fbbf24; }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: fixed; width: 100%; user-select: none; }
        .app-header { background: var(--panel); padding: 12px 16px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; font-weight: 600; font-size: 14px; align-items: center; }
        .btn-save { background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); z-index: 100;}
        .preview-area { background: #000; display: flex; justify-content: center; padding: 10px; height: 30vh; border-bottom: 1px solid #333; position: relative; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; border-radius: 8px; background: #0a0a0a; cursor: crosshair; box-shadow: 0 0 20px rgba(0,0,0,0.8); transition: width 0.2s, height 0.2s; z-index: 10; display: block; }
        .status-rec { position: absolute; top: 15px; right: 20px; background: #ef4444; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; display: none; animation: pulse 1.5s infinite; z-index: 50; box-shadow: 0 0 10px #ef4444; }
        .timeline-editor { background: var(--panel); display: flex; flex-direction: column; height: 32vh; border-bottom: 1px solid #333; }
        .timeline-toolbar { display: flex; gap: 15px; padding: 10px 12px; background: #000; font-size: 14px; align-items: center; border-bottom: 1px solid #222; }
        .action-btn { cursor: pointer; color: #a1a1aa; padding: 5px; transition: 0.2s; }
        .tracks-container { flex: 1; padding: 10px 0; overflow-x: auto; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; position: relative; scroll-behavior: smooth; }
        .track { height: 40px; background: var(--track-bg); display: flex; position: relative; min-width: 300vw; border-bottom: 1px solid #2a2a30; }
        .track-label { position: sticky; left: 0; background: #0a0a0c; width: 45px; display: flex; justify-content: center; align-items: center; font-size: 10px; z-index: 30; border-right: 1px solid #444; color: #aaa; font-weight: bold; }
        .playhead-container { position: absolute; top: 0; bottom: 0; left: 45px; width: 20px; z-index: 40; transform: translateX(-10px); cursor: ew-resize; }
        .playhead-line { position: absolute; left: 10px; width: 2px; height: 100%; background: #ffffff; pointer-events: none; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .playhead-head { position: absolute; left: 5px; top: 0; width: 12px; height: 12px; background: #ffffff; clip-path: polygon(0 0, 100% 0, 50% 100%); pointer-events: none; }
        .marker-in { position: absolute; top: 0; bottom: 0; width: 4px; background: #10b981; z-index: 35; left: 45px; cursor: ew-resize; }
        .marker-out { position: absolute; top: 0; bottom: 0; width: 4px; background: #fbbf24; z-index: 35; left: 500px; cursor: ew-resize; }
        .clip-block { position: absolute; height: 90%; top: 5%; background: linear-gradient(135deg, #2563eb, #3b82f6); border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; font-weight: bold; z-index: 20; color: white; cursor: grab; }
        .clip-block.image { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .clip-block.text { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
        .btn { background: #27272a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn.primary { background: var(--neon); }
        .btn.danger { background: #ef4444; }
    </style>
</head>
<body>
    <div class="app-header">
        <span><i class="fa-solid fa-crown" style="color: #fbbf24;"></i> CapacitiumX V47 (Master Definitiva)</span>
        <button class="btn-save" onclick="exportVideo()">EXPORTAR</button>
    </div>
    <div class="preview-area">
        <div class="status-rec" id="recBadge"><i class="fa-solid fa-microphone"></i> GRABANDO...</div>
        <canvas id="mainCanvas"></canvas>
    </div>
    <div class="timeline-editor">
        <div class="timeline-toolbar">
            <i class="fa-solid fa-play action-btn" id="btnPlay" onclick="togglePlayback()"></i>
            <span id="timecode" style="font-family: monospace; color: #10b981;">00:00.0</span>
        </div>
        <div class="tracks-container" id="timelineScroll">
            <div class="marker-in" id="markerIn"></div>
            <div class="marker-out" id="markerOut"></div>
            <div class="playhead-container" id="playhead" onmousedown="startDragPlayhead(event)">
                <div class="playhead-head"></div>
                <div class="playhead-line"></div>
            </div>
            <div class="track" id="imageTrack"><div class="track-label">Img</div></div>
            <div class="track" id="textTrack"><div class="track-label">Txt</div></div>
            <div class="track" id="audioTrack"><div class="track-label">Voz</div></div>
        </div>
    </div>
    <div class="control-panel">
        <div class="tab-menu">
            <div class="tab-btn active" onclick="switchTab('media', this)">Medios</div>
        </div>
        <div id="media" class="tab-content active">
            <button class="btn primary" onclick="document.getElementById('fileUpload').click()">Importar Medios</button>
            <input type="file" id="fileUpload" accept="image/*,video/*" multiple style="display:none;" onchange="addMediaToTimeline(event)">
            <button class="btn danger" id="btnRecVoice" onclick="toggleVoiceRecord()">Grabar Voz (Mic)</button>
        </div>
    </div>

    <script>
        let projectClips = [], playheadX = 45, isPlaying = false, playInterval, isRecordingVoice = false, mediaRecorder, voiceChunks = [];
        const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
        canvas.width = 1280; canvas.height = 720;

        function addMediaToTimeline(event) {
            const files = event.target.files;
            let start = 45;
            projectClips.forEach(c => { if(c.startPx + c.widthPx > start) start = c.startPx + c.widthPx; });
            for(let i=0; i<files.length; i++) {
                const id = Date.now() + i;
                const img = new Image(); img.src = URL.createObjectURL(files[i]);
                projectClips.push({ id, type: 'image', startPx: start, widthPx: 300, img, content: files[i].name, x: 640, y: 360 });
                projectClips.push({ id: id+1, type: 'text', startPx: start, widthPx: 300, content: files[i].name, x: 640, y: 680, size: 40 });
                
                const ui = document.createElement('div'); ui.className = 'clip-block image'; ui.style.left = start+'px'; ui.innerText = files[i].name;
                document.getElementById('imageTrack').appendChild(ui);
                const txt = document.createElement('div'); txt.className = 'clip-block text'; txt.style.left = start+'px'; txt.innerText = files[i].name;
                document.getElementById('textTrack').appendChild(txt);
                start += 310;
            }
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('btnRecVoice');
            if(!isRecordingVoice) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                voiceChunks = [];
                mediaRecorder.ondataavailable = e => voiceChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audio = new Audio(URL.createObjectURL(new Blob(voiceChunks)));
                    projectClips.push({ type: 'audio', startPx: playheadX, widthPx: 300, domElement: audio });
                    const ui = document.createElement('div'); ui.className = 'clip-block audio'; ui.style.left = playheadX + 'px'; ui.innerText = "Voz Off";
                    document.getElementById('audioTrack').appendChild(ui);
                };
                mediaRecorder.start(); isRecordingVoice = true; btn.innerText = "Detener"; document.getElementById('recBadge').style.display = 'block';
            } else { mediaRecorder.stop(); isRecordingVoice = false; btn.innerText = "Grabar Voz (Mic)"; document.getElementById('recBadge').style.display = 'none'; }
        }

        function togglePlayback() {
            const btn = document.getElementById('btnPlay');
            if(isPlaying) { clearInterval(playInterval); isPlaying = false; btn.className = "fa-solid fa-play"; }
            else { isPlaying = true; btn.className = "fa-solid fa-pause"; playInterval = setInterval(() => { playheadX += 5; document.getElementById('playhead').style.left = playheadX + 'px'; document.getElementById('timelineScroll').scrollLeft = playheadX - 100; }, 40); }
        }

        function startDragPlayhead(e) { document.onmousemove = (me) => { playheadX = Math.max(45, me.clientX); document.getElementById('playhead').style.left = playheadX + 'px'; }; document.onmouseup = () => document.onmousemove = null; }

        function renderLoop() {
            ctx.fillStyle = "#050507"; ctx.fillRect(0,0, canvas.width, canvas.height);
            projectClips.forEach(o => {
                if(playheadX >= o.startPx && playheadX <= o.startPx + o.widthPx) {
                    if(o.type === 'image' && o.img.complete) ctx.drawImage(o.img, 0, 0, canvas.width, canvas.height);
                    if(o.type === 'text') { ctx.fillStyle="white"; ctx.font=o.size+"px Arial"; ctx.textAlign="center"; ctx.fillText(o.content, canvas.width/2, o.y); }
                }
            });
            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        function switchTab(id, btn) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); document.getElementById(id).classList.add('active'); btn.classList.add('active'); }
        function exportVideo() { alert("Procesando..."); }
    </script>
</body>
</html>
